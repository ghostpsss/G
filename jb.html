<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AhmedHEN | GoldHEN</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; min-height:100%; background:#050507; color:#f3f3f5; font:16px/1.5 system-ui,Segoe UI,sans-serif; }
      body { min-height:100vh; overflow-x:hidden; background:radial-gradient(ellipse at 50% 20%,#27070b 0%,#0b0709 43%,#030304 100%); }
      body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.22; background:linear-gradient(120deg,transparent 25%,rgba(255,0,28,.12),transparent 65%); }
      #brand { position:relative; display:flex; flex-direction:column; align-items:center; gap:10px; padding:24px 16px 16px; text-align:center; border-bottom:1px solid #5c1018; background:rgba(5,5,7,.82); }
      #brand img { width:min(190px,48vw); height:auto; max-height:220px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(255,0,30,.34)); border-radius:14px; }
      #brand b { font-size:clamp(23px,5vw,34px); font-weight:900; letter-spacing:.07em; color:#f5f5f5; text-shadow:0 0 18px #8e0011; }
      #brand b span { color:#ff1735; }
      #spin { position:fixed; top:65%; left:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border:4px solid #321017; border-top-color:#ff1735; border-radius:50%; animation:spin .85s linear infinite; z-index:3; }
      @keyframes spin { to { transform:rotate(360deg); } }
      #msg { position:relative; z-index:2; width:min(92%,520px); margin:28px auto; padding:24px 18px; text-align:center; border:1px solid #6e101c; border-radius:18px; background:linear-gradient(145deg,rgba(35,5,10,.95),rgba(8,8,10,.97)); box-shadow:0 0 28px rgba(255,0,35,.12),inset 0 0 22px rgba(255,0,35,.05); display:none; }
      #msg .message { display:block; font-size:clamp(17px,4vw,22px); font-weight:750; margin-bottom:18px; }
      #retry { display:none; width:100%; max-width:310px; border:1px solid #ff263f; border-radius:999px; padding:14px 20px; background:linear-gradient(180deg,#ff233e,#9b0018); color:white; font-size:18px; font-weight:800; box-shadow:0 0 20px rgba(255,0,35,.3); cursor:pointer; }
      #retry:active { transform:scale(.98); }
      #wrap { padding:0; }
      #state,#out { display:none; }
      body.done #spin, body.fail #spin { display:none; }
      body.fail #msg, body.done #msg { display:block; }
      body.done #msg { border-color:#176b39; box-shadow:0 0 24px rgba(0,255,90,.12); }
      body.done #msg .message { color:#54ff91; }
      body.fail #msg .message { color:#fff; }
      body.fail #retry { display:inline-block; }
      body.log #spin, body.log #msg { display:none; }
      body.log #wrap { padding:14px 18px; }
      body.log #state { display:block; font-size:22px; font-weight:700; margin:0 0 8px; }
      body.log #out { display:block; white-space:pre-wrap; font:12px/1.45 Consolas,monospace; background:#11151b; border:1px solid #5b1019; border-radius:10px; padding:10px 12px; height:calc(100vh - 40px); overflow-y:auto; }
      .ok,.safe { color:#7fffa7; } .bad,.danger { color:#ff6b7d; } .warn { color:#ffd477; } code { color:#ff8796; }
      .hint { color:#a9a9b3; font-size:13px; margin-top:14px; }
    </style>
  </head>
